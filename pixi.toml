[workspace]
channels = [
    "conda-forge",
    "bioconda",
    "nodefaults"
]
name = "kyh_microbio_depression"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

snakemake_all = "snakemake --resources mem_mb=10500 --cores 8 --rerun-incomplete"
snakemake_unlock = "snakemake --unlock"
snakemake_dry = "snakemake -n --cores 4"
snakemake_dag = "snakemake -n --dag --quiet | sed -n '/^digraph/,$p' | dot -Tpdf > results/reports/workflow-dag.pdf"
new_step = "utils/new_step.sh"

[dependencies]
python = ">=3.13.13,<3.14"
snakemake = ">=9.19.0,<10"
pandas = ">=2.3.3,<3"
graphviz = { version = ">=14.1.2,<15", channel = "conda-forge" }
jupyter = ">=1.1.1,<2"
notebook = ">=7.5.5,<8"
r-dplyr = ">=1.2.1,<2"
r-base = { version = ">=4.5.3,<4.6", channel = "conda-forge" }
r-irkernel = { version = ">=1.3.2,<2", channel = "conda-forge" }
r-tidyverse = { version = ">=2.0.0,<3", channel = "conda-forge" }
r-rmarkdown = { version = ">=2.31,<3", channel = "conda-forge" }
bioconductor-dada2 = { version = "==1.38.0", channel = "bioconda" }
bioconductor-decipher = { version = "==3.6.0", channel = "bioconda" }
sra-tools = "==3.2.1"
cutadapt = { version = "==5.2", channel = "bioconda" }
fastqc = { version = "==0.12.1", channel = "bioconda" }
multiqc = { version = "==1.34", channel = "bioconda" }
papermill = { version = ">=2.7.0,<3", channel = "conda-forge" }
bioconductor-shortread = { version = ">=1.68.0,<2", channel = "bioconda" }
openpyxl = ">=3.1.5,<4"
scipy = ">=1.17.1,<2"
seaborn = ">=0.13.2,<0.14"
bioconductor-deseq2 = { version = ">=1.50.2,<2", channel = "bioconda" }
bioconductor-phyloseq = { version = ">=1.54.0,<2", channel = "bioconda" }
r-languageserver = { version = ">=0.3.18,<0.4", channel = "conda-forge" }
r-vegan = ">=2.7_3,<3"
r-patchwork = { version = ">=1.3.2,<2", channel = "conda-forge" }
